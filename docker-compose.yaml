services:
  authentication-service:
    container_name: authentication-service
    image: ceas/authentication-service:latest
    build:
      context: ./authentication
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./authentication/.env
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
